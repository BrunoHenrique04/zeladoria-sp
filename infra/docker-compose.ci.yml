# Ferramentas de CI: Jenkins e SonarQube. A aplicação sobe pelo docker-compose.yml da raiz.
# Use o infra/setup-vm.sh para subir tudo na ordem certa.

name: ci

services:
  jenkins:
    build: ./jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    group_add:
      - "${DOCKER_GID:?rode o setup-vm.sh para gerar o .env}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx768m
      JENKINS_URL: ${JENKINS_URL}
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      DOCKERHUB_USER: ${DOCKERHUB_USER}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN}
      DOCKERHUB_REPO: ${DOCKERHUB_REPO}
      SONAR_TOKEN: ${SONAR_TOKEN}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      GIT_REPO_URL: ${GIT_REPO_URL}
    volumes:
      # Mesmo caminho dentro e fora do container: os estágios montam o workspace
      # em containers irmãos pelo Docker do host.
      - /var/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devsecops

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - devsecops

  sonar-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devsecops

networks:
  devsecops:
    name: devsecops

volumes:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  sonar-db-data:
