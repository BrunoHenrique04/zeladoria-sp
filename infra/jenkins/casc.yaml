# Configuração do Jenkins como código (plugin JCasC).
# Os valores ${...} vêm das variáveis de ambiente do container (infra/.env).

jenkins:
  systemMessage: "Zeladoria SP - pipeline DevSecOps (FIAP Global Solution 2026)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: DOCKERHUB_REPO
            value: "${DOCKERHUB_REPO}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub
              description: Docker Hub (access token)
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"
          - string:
              scope: GLOBAL
              id: sonar-token
              description: Token de análise do SonarQube
              secret: "${SONAR_TOKEN}"
          - string:
              scope: GLOBAL
              id: app-db-password
              description: Senha do PostgreSQL da aplicação
              secret: "${APP_DB_PASSWORD}"

unclassified:
  location:
    url: "${JENKINS_URL}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: sonarqube
        serverUrl: http://sonarqube:9000
        credentialsId: sonar-token

jobs:
  - script: |
      pipelineJob('zeladoria-sp') {
        description('Pipeline DevSecOps da API Zeladoria SP')
        properties {
          githubProjectUrl('${GIT_REPO_URL}')
          pipelineTriggers {
            triggers {
              githubPush()
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPO_URL}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
